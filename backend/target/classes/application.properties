
# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/women_safety?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate and JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Server
server.port=8081

# JWT Configuration
app.jwt.secret=SafeWayWomenSafetyPrototypeSecretKey2026SecureForHS256
app.jwt.expiration-ms=86400000

# Safe Journey Configuration
app.journey.grace-period-minutes=15
